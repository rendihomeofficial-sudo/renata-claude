name: Rilis & Update Manifest Otomatis

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Kode
        uses: actions/checkout@v4

      - name: Siapkan JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Release APK dari Kode Sumber
        run: |
          mkdir -p build_output
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          
          # Konfigurasi Android SDK bawaan runner Ubuntu
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          echo "Menerima lisensi Android SDK..."
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          
          echo "Membangun APK release resmi versi ${VERSION} dari source code..."
          set +e
          gradle :app:assembleRelease --no-daemon --stacktrace > build.log 2>&1
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            echo "Build GAGAL! Berikut log error-nya:"
            tail -n 80 build.log
            exit $STATUS
          fi
          set -e
          
          APK_FILE=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: Berkas APK tidak ditemukan setelah build!"
            exit 1
          fi
          
          echo "Berhasil! Ditemukan APK: $APK_FILE"
          cp "$APK_FILE" "build_output/Renata-Claude-${VERSION}.apk"
          ls -la build_output/

      - name: Perbarui Tautan Unduhan di version.json
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          REPO="${{ github.repository }}"
          DOWNLOAD_URL="https://github.com/${REPO}/releases/download/${TAG_NAME}/Renata-Claude-${VERSION}.apk"
          echo "Updating version.json with download URL: ${DOWNLOAD_URL}"
          sed -i "s|\"downloadUrl\": \".*\"|\"downloadUrl\": \"${DOWNLOAD_URL}\"|g" version.json

      - name: Buat GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build_output/*.apk
            version.json
          name: "Renata Claude ${{ github.ref_name }}"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
