name: Rilis & Update Manifest Otomatis

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Kode
        uses: actions/checkout@v4

      - name: Siapkan JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build / Siapkan Release APK
        run: |
          set -euo pipefail
          mkdir -p build_output
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"

          # Jika berkas APK sudah ada di folder dist/ (hasil build lokal yang siap pakai)
          if [ -f "dist/Renata-Claude-${VERSION}.apk" ]; then
            echo "Menggunakan APK siap pakai dari dist/Renata-Claude-${VERSION}.apk"
            cp "dist/Renata-Claude-${VERSION}.apk" "build_output/Renata-Claude-${VERSION}.apk"
          elif [ -f "gradlew" ]; then
            echo "Membangun APK menggunakan gradlew..."
            chmod +x gradlew
            ./gradlew :app:assembleRelease --no-daemon
            APK_FILE=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
            cp "$APK_FILE" "build_output/Renata-Claude-${VERSION}.apk"
          else
            echo "Tidak ada APK siap pakai maupun gradlew." >&2
            exit 1
          fi

      - name: Susun manifest rilis (version.json)
        run: |
          set -euo pipefail
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          REPO="${{ github.repository }}"
          DOWNLOAD_URL="https://github.com/${REPO}/releases/download/${TAG_NAME}/Renata-Claude-${VERSION}.apk"
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -n 1)
          if [ -z "${VERSION_CODE}" ]; then
            echo "versionCode tidak ditemukan di app/build.gradle.kts" >&2
            exit 1
          fi
          python3 - "$VERSION" "$VERSION_CODE" "$DOWNLOAD_URL" <<'PY'
          import datetime, json, sys
          version, code, url = sys.argv[1], int(sys.argv[2]), sys.argv[3]
          notes = ""
          try:
              with open("version.json", encoding="utf-8") as handle:
                  notes = json.load(handle).get("releaseNotes", "")
          except Exception:
              pass
          data = {
              "versionName": version,
              "versionCode": code,
              "downloadUrl": url,
              "releaseNotes": notes,
              "publishedAt": datetime.date.today().isoformat(),
          }
          with open("version.json", "w", encoding="utf-8") as handle:
              json.dump(data, handle, indent=2, ensure_ascii=False)
              handle.write("\n")
          PY
          cp version.json "${RUNNER_TEMP}/release-version.json"
          echo "Manifest rilis disusun: v${VERSION} (versionCode ${VERSION_CODE})"

      - name: Buat GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build_output/*.apk
            version.json
          name: "Renata Claude ${{ github.ref_name }}"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Terbitkan manifest pembaruan di branch main
        run: |
          set -euo pipefail
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --force origin "+refs/heads/main:refs/remotes/origin/main"
          git checkout -f -B manifest-release refs/remotes/origin/main
          cp "${RUNNER_TEMP}/release-version.json" version.json
          git add version.json
          if git diff --cached --quiet; then
            echo "Manifest di branch main sudah versi ${VERSION}, tidak ada perubahan."
          else
            git commit -m "chore(release): manifest pembaruan v${VERSION}"
            git push origin HEAD:main
          fi
