name: Rilis & Update Manifest Otomatis

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Kode
        uses: actions/checkout@v4

      - name: Siapkan JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build / Siapkan Release APK
        run: |
          mkdir -p build_output
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          
          # Jika berkas APK sudah ada di folder dist/ (hasil build lokal yang siap pakai)
          if [ -f "dist/Renata-Claude-${VERSION}.apk" ]; then
            echo "Menggunakan APK siap pakai dari dist/Renata-Claude-${VERSION}.apk"
            cp "dist/Renata-Claude-${VERSION}.apk" "build_output/Renata-Claude-${VERSION}.apk"
          elif [ -f "gradlew" ]; then
            echo "Membangun APK menggunakan gradlew..."
            chmod +x gradlew
            ./gradlew :app:assembleRelease --no-daemon
            APK_FILE=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
            cp "$APK_FILE" "build_output/Renata-Claude-${VERSION}.apk"
          fi

      - name: Perbarui Tautan Unduhan di version.json
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          REPO="${{ github.repository }}"
          DOWNLOAD_URL="https://github.com/${REPO}/releases/download/${TAG_NAME}/Renata-Claude-${VERSION}.apk"
          echo "Updating version.json with download URL: ${DOWNLOAD_URL}"
          sed -i "s|\"downloadUrl\": \".*\"|\"downloadUrl\": \"${DOWNLOAD_URL}\"|g" version.json

      - name: Buat GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build_output/*.apk
            version.json
          name: "Renata Claude ${{ github.ref_name }}"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
